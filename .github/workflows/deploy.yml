name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout GearUI Kit Web sample
        uses: actions/checkout@v5
        with:
          repository: gearui/gearui-kit
          ref: 41784f3bf475ea9b4ce3337905c3f0c4c86f759b
          path: gearui-kit
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The host stages a development bundle as a resource. Build production
      # bundles in separate Gradle invocations so their outputs never collide.
      - name: Build Web host
        working-directory: gearui-kit
        run: ./gradlew --no-daemon :sample:jsApp:jsBrowserProductionWebpack
      - name: Build Web sample
        working-directory: gearui-kit
        run: ./gradlew --no-daemon :sample:jsBrowserProductionWebpack
      - name: Add interactive demo to Pages artifact
        run: node scripts/build-web-demo.mjs gearui-kit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
